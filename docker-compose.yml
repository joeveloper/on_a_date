services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crushly
      POSTGRES_PASSWORD: crushly
      POSTGRES_DB: crushly
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file:
      - .env.example
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://crushly:crushly@db:5432/crushly?schema=public}
    ports:
      - '4000:4000'
    depends_on:
      - db

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    env_file:
      - .env.example
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  postgres_data:
